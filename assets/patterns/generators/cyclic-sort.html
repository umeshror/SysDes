<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyclic Sort Animation</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #cdd6f4;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            color: #89b4fa;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(137, 180, 250, 0.5);
        }

        .array-container {
            position: relative;
            height: 170px;
            width: 100%;
            margin-bottom: 1rem;
            border-radius: 12px;
            background-color: #11111b;
            border: 1px solid #313244;
        }

        .element {
            width: 60px;
            height: 60px;
            background-color: #313244;
            border: 2px solid #585b70;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            position: absolute;
            /* Using absolute for swapping animations */
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .element.active {
            border-color: #f9e2af;
            background-color: rgba(249, 226, 175, 0.2);
            color: #f9e2af;
            box-shadow: 0 0 15px rgba(249, 226, 175, 0.5);
            transform: scale(1.1);
            z-index: 20;
        }

        .element.target {
            border-color: #f38ba8;
            background-color: rgba(243, 139, 168, 0.2);
            color: #f38ba8;
            box-shadow: 0 0 15px rgba(243, 139, 168, 0.5);
            transform: scale(1.1);
            z-index: 20;
        }

        .element.correct {
            border-color: #a6e3a1;
            background-color: rgba(166, 227, 161, 0.3);
            color: #a6e3a1;
            box-shadow: 0 0 15px rgba(166, 227, 161, 0.5);
        }

        .slot {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px dashed #45475a;
            border-radius: 8px;
            top: 50px;
        }

        .slot-index {
            position: absolute;
            width: 60px;
            text-align: center;
            top: 125px;
            color: #a6adc8;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .pointer {
            position: absolute;
            top: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #89b4fa;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            width: 60px;
            text-align: center;
            display: none;
        }

        .description {
            margin-top: 1rem;
            font-size: 1.2rem;
            color: #bac2de;
            min-height: 3rem;
            font-style: italic;
            padding: 10px;
            background-color: rgba(49, 50, 68, 0.5);
            border-radius: 8px;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #b4befe;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #585b70;
            color: #a6adc8;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Cyclic Sort</h1>
        <p style="color: #a6adc8; margin-bottom: 2rem;">Numbers range from 1 to N. We want `arr[i] == i + 1`.</p>

        <div class="array-container" id="array-container">
            <div class="pointer" id="main-pointer">↓</div>
            <!-- Elements inserted by JS -->
        </div>

        <div class="description" id="step-description">Click "Start Animation" to begin.</div>

        <div class="controls">
            <button id="start-btn" onclick="startAnimation()">Start Animation</button>
            <button id="reset-btn" onclick="resetAnimation()" disabled>Reset</button>
        </div>
    </div>

    <script>
        const initialArray = [3, 1, 5, 4, 2];
        let currentArray = [];

        const containerWidth = 800; // estimated
        const elementWidth = 60;
        const gap = 20;
        const totalWidth = (initialArray.length * elementWidth) + ((initialArray.length - 1) * gap);
        const startX = (containerWidth - totalWidth) / 2;

        const container = document.getElementById('array-container');
        const pointer = document.getElementById('main-pointer');
        const descEl = document.getElementById('step-description');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');

        let animationTimeouts = [];

        function getXPos(index) {
            return startX + (index * (elementWidth + gap));
        }

        function init() {
            resetState();
        }

        function resetState() {
            animationTimeouts.forEach(clearTimeout);
            animationTimeouts = [];

            currentArray = [...initialArray];

            // Clear container
            container.innerHTML = '<div class="pointer" id="main-pointer">↓</div>';
            const freshPointer = document.getElementById('main-pointer');
            freshPointer.style.display = 'block';
            freshPointer.style.left = `${getXPos(0)}px`;

            // Create slots, labels, and elements
            currentArray.forEach((val, i) => {
                const xPos = getXPos(i);

                // Background slot
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.style.left = `${xPos}px`;
                container.appendChild(slot);

                // Index label
                const label = document.createElement('div');
                label.className = 'slot-index';
                label.style.left = `${xPos}px`;
                label.textContent = `idx: ${i}`;
                container.appendChild(label);

                // Actual element
                const el = document.createElement('div');
                el.className = 'element';
                el.id = `el-${val}`; // Keyed by value, not index!
                el.textContent = val;
                el.style.left = `${xPos}px`;
                el.style.top = `50px`;
                container.appendChild(el);
            });

            descEl.textContent = 'Each number (val) belongs at index (val - 1).';

            startBtn.disabled = false;
            resetBtn.disabled = true;
        }

        function updateElementStatus() {
            currentArray.forEach((val, i) => {
                const el = document.getElementById(`el-${val}`);
                if (!el) return; // Element might have been swapped out if not using value as ID

                el.classList.remove('active', 'target');
                if (val === i + 1) {
                    el.classList.add('correct');
                } else {
                    el.classList.remove('correct');
                }
            });
        }

        function scheduleTask(task, delay) {
            animationTimeouts.push(setTimeout(task, delay));
        }

        function startAnimation() {
            startBtn.disabled = true;
            resetBtn.disabled = false;

            let time = 0;
            const stepDelay = 2500;

            let i = 0;

            function step() {
                if (i >= currentArray.length) {
                    scheduleTask(() => {
                        descEl.innerHTML = `<span style="color:#a6e3a1;font-weight:bold;">Finished! Array is sorted.</span>`;
                        document.getElementById('main-pointer').style.display = 'none';
                        updateElementStatus();
                    }, stepDelay);
                    return;
                }

                const val = currentArray[i];
                const j = val - 1;

                scheduleTask(() => {
                    document.getElementById('main-pointer').style.left = `${getXPos(i)}px`;
                }, time);

                if (val > 0 && val <= currentArray.length && currentArray[i] !== currentArray[j]) {
                    const targetVal = currentArray[j];

                    scheduleTask(() => {
                        updateElementStatus();
                        const elI = document.getElementById(`el-${val}`);
                        const elJ = document.getElementById(`el-${targetVal}`);

                        elI.classList.add('active');
                        elJ.classList.add('target');
                        descEl.innerHTML = `Index ${i}: Value is <span style="color:#f9e2af">${val}</span>. It belongs at index <span style="color:#f38ba8">${j}</span>.<br>Swapping <span style="color:#f9e2af">${val}</span> with <span style="color:#f38ba8">${targetVal}</span>.`;

                        // DOM visual swap
                        elI.style.left = `${getXPos(j)}px`;
                        elJ.style.left = `${getXPos(i)}px`;

                        // Arc up and down
                        elI.style.top = `0px`;
                        elJ.style.top = `100px`;

                        setTimeout(() => {
                            elI.style.top = `50px`;
                            elJ.style.top = `50px`;
                        }, 300);

                    }, time);

                    // Logic update
                    const temp = currentArray[i];
                    currentArray[i] = currentArray[j];
                    currentArray[j] = temp;

                    time += stepDelay;
                    step(); // Keep i exactly where it is to check the newly swapped element
                } else {
                    // Correct place
                    scheduleTask(() => {
                        updateElementStatus();
                        const elI = document.getElementById(`el-${val}`);
                        elI.classList.add('correct');

                        if (val === i + 1) {
                            descEl.innerHTML = `Index ${i}: Value <span style="color:#a6e3a1">${val}</span> is already at its correct index (${i}). Move forward.`;
                        } else {
                            descEl.innerHTML = `Index ${i}: Value ${val} is duplicate or out of bounds. Move forward.`;
                        }
                    }, time);

                    i++;
                    time += stepDelay;
                    step();
                }
            }

            step();
        }

        window.onload = init;
    </script>
</body>

</html>
